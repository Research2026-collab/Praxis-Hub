<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisHub – Beitrag einstellen</title>
<style>
:root {
  --navy: #1a365d; --navy-light: #2a4a7f; --teal: #2b7a78; --teal-light: #3aafa9;
  --amber: #d69e2e; --red: #c53030; --green: #276749;
  --bg: #f7f8fa; --surface: #ffffff; --text: #1a202c;
  --text-muted: #4a5568; --text-light: #718096; --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; font-size:15px; }
.app { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
.header { text-align:center; margin-bottom:28px; }
.header img.logo { height:70px; margin-bottom:14px; }
.eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--teal); margin-bottom:6px; }
h1 { font-size:24px; font-weight:800; color:var(--navy); margin:0 0 10px; }
.subtitle { font-size:14px; color:var(--text-muted); max-width:560px; margin:0 auto; }
.nav-links { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.nav-links a { font-size:12px; font-weight:700; color:var(--navy); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 16px; text-decoration:none; }
.nav-links a:hover { border-color:var(--teal); color:var(--teal); }
.panel-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; }
.form-field { margin-bottom:16px; }
.form-field label { font-size:13px; font-weight:600; display:block; margin-bottom:4px; }
.form-field label .required { color:var(--red); }
.form-field .hint { font-size:12px; color:var(--text-light); margin-bottom:4px; }
input[type="text"], input[type="url"], textarea, select {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px;
  font-size:14px; font-family:inherit; color:var(--text); background:var(--bg);
}
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(43,122,120,0.1); }
textarea { min-height:70px; resize:vertical; }
.check-group { display:flex; flex-wrap:wrap; gap:6px; }
.check-item { display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; }
.check-item.selected { border-color:var(--teal); background:#ebf8ff; }
.check-item input { accent-color:var(--teal); }
.form-section-title { font-size:12px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.06em; margin:24px 0 10px; border-top:1px solid var(--border); padding-top:16px; }
.form-section-title:first-of-type { border-top:none; padding-top:0; }
.form-actions { display:flex; gap:10px; margin-top:24px; }
.btn-new { padding:12px 28px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; border:none; background:var(--teal); color:#fff; font-family:inherit; }
.btn-new:hover:not(:disabled) { background:var(--navy-light); }
.btn-new:disabled { opacity:0.6; cursor:default; }
.status-msg { font-size:13px; margin-top:10px; }
.status-msg.ok { color:var(--green); }
.status-msg.err { color:var(--red); }
.loading { text-align:center; color:var(--text-light); padding:40px 0; }
</style>
</head>

<script>
// Nach dem Deployment die exec-URL der Apps-Script-Web-App hier eintragen.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxp9Q1tJAzkP1quxj5tYoyU63D6PFAvp-VD-36oQn5D2jXzVDBlm-sZyY8vWbmbwZgOBQ/exec';

const MEHRFACHAUSWAHL_FELDER = ['Zielgruppe', 'Voraussetzungen', 'Format'];
let BEKANNTE_EINRICHTUNGEN = [];
let WERTELISTEN = {};

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function checkGroup(id, label, hint, values) {
  const items = (values || []).map(v => `
    <label class="check-item" data-field="${id}">
      <input type="checkbox" value="${esc(v)}" onclick="this.parentElement.classList.toggle('selected', this.checked)">
      ${esc(v)}
    </label>`).join('');
  return `<div class="form-field">
    <label>${label}</label>
    <div class="hint">${hint}</div>
    <div class="check-group" id="group_${id}">${items}</div>
  </div>`;
}

function selectField(id, label, values, required) {
  const opts = (values || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  return `<div class="form-field">
    <label>${label} ${required ? '<span class="required">*</span>' : ''}</label>
    <select id="${id}"><option value="">Bitte wählen</option>${opts}</select>
  </div>`;
}

function textField(id, label, required, placeholder, area) {
  const tag = area ? `<textarea id="${id}" placeholder="${placeholder || ''}"></textarea>`
                   : `<input type="text" id="${id}" placeholder="${placeholder || ''}">`;
  return `<div class="form-field"><label>${label} ${required ? '<span class="required">*</span>' : ''}</label>${tag}</div>`;
}

function textFieldMitVorschlag(id, label, required, hint, listId, vorschlaege) {
  const options = (vorschlaege || []).map(v => `<option value="${esc(v)}">`).join('');
  return `<div class="form-field">
    <label>${label} ${required ? '<span class="required">*</span>' : ''}</label>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    <input type="text" id="${id}" list="${listId}" autocomplete="off">
    <datalist id="${listId}">${options}</datalist>
  </div>`;
}

function renderForm() {
  const w = WERTELISTEN;
  const area = document.getElementById('formArea');
  area.innerHTML = `
    <h2 style="font-size:20px; font-weight:800; color:var(--navy); margin-bottom:4px;">Neuen Beitrag einstellen</h2>
    <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">Felder mit * sind Pflichtfelder. Alle anderen Angaben sind optional.</p>

    <div class="form-section-title">Pflichtangaben</div>
    ${textField('n_titel', 'Titel', true)}
    ${textField('n_kurz', 'Kurzbeschreibung', true, '', true)}
    ${selectField('n_hauptbereich', 'Hauptbereich', w['Hauptbereich'], true)}
    ${checkGroup('n_zielgruppe', 'Zielgruppe', 'Mehrfachauswahl möglich', w['Zielgruppe'])}
    ${selectField('n_materialformat', 'Materialformat', w['Materialformat'], true)}
    ${selectField('n_umsetzungsstand', 'Umsetzungsstand', w['Umsetzungsstand'], true)}
    ${textFieldMitVorschlag('n_einrichtung', 'Einstellende Einrichtung', true, 'Bitte zuerst prüfen, ob die eigene Einrichtung bereits in der Vorschlagsliste erscheint, und diesen Vorschlag anklicken, statt den Namen erneut in abweichender Schreibweise einzutippen.', 'liste_einrichtungen', BEKANNTE_EINRICHTUNGEN)}
    ${selectField('n_bundesland', 'Bundesland', w['Bundesland'], true)}
    ${selectField('n_nutzungsrechte', 'Nutzungsrechte', w['Nutzungsrechte'], true)}
    ${textField('n_schlagworte', 'Schlagworte (kommagetrennt)', true)}
    ${selectField('n_sichtbarkeit', 'Sichtbarkeit', w['Sichtbarkeit'], true)}

    <div class="form-section-title">Kontakt</div>
    ${textField('n_name', 'Name', false)}
    ${textField('n_email', 'E-Mail', false)}

    <div class="form-section-title">Weitere Basisinformationen</div>
    ${selectField('n_sprachebene', 'Sprachebene', w['Sprachebene'], false)}
    ${selectField('n_kostenrahmen_nachnutzung', 'Kostenrahmen für Nachnutzung', w['Kostenrahmen für Nachnutzung'], false)}
    ${textField('n_url', 'URL', false, 'https://...')}

    <div class="form-section-title">Umsetzung</div>
    ${selectField('n_teilnahmeform', 'Teilnahmeform', w['Teilnahmeform'], false)}
    ${checkGroup('n_format', 'Format', 'Mehrfachauswahl möglich', w['Format'])}
    ${textField('n_dauer', 'Dauer', false, 'z. B. 90 Minuten')}
    ${textField('n_gruppengroesse', 'Gruppengröße', false, 'z. B. 8–12 Personen')}
    ${selectField('n_aufwand', 'Aufwand', w['Aufwand'], false)}
    ${textField('n_ressourcen', 'Benötigte Ressourcen', false, '', true)}
    ${selectField('n_kostenrahmen', 'Kostenrahmen', w['Kostenrahmen'], false)}
    ${selectField('n_referierende', 'Referierende erforderlich', w['Referierende erforderlich'], false)}
    ${textField('n_vorbereitungszeit', 'Vorbereitungszeit', false)}
    ${textField('n_durchfuehrung', 'Durchführungsanleitung', false, '', true)}
    ${textField('n_materialien', 'Materialien vorhanden', false, '', true)}
    ${textField('n_transferbedingungen', 'Transferbedingungen', false, '', true)}
    ${selectField('n_uebertragbarkeit', 'Übertragbarkeit', w['Übertragbarkeit'], false)}
    ${checkGroup('n_voraussetzungen', 'Voraussetzungen', 'Mehrfachauswahl möglich', w['Voraussetzungen'])}

    <div class="form-section-title">Qualität und Erfahrung</div>
    ${textField('n_bewertung', 'Bewertung aus der Praxis', false, '', true)}
    ${textField('n_stolpersteine', 'Stolpersteine', false, '', true)}
    ${textField('n_verbesserung', 'Verbesserungsideen', false, '', true)}
    ${selectField('n_evaluation', 'Evaluation vorhanden', w['Evaluation vorhanden'], false)}
    ${textField('n_wirkung', 'Wirkung/Nutzen', false, '', true)}
    ${textField('n_geeignet_fuer', 'Besonders geeignet für', false)}
    ${textField('n_nicht_geeignet_fuer', 'Nicht geeignet für', false)}

    <div class="form-section-title">Rechte und Zusammenarbeit</div>
    ${selectField('n_veraenderung', 'Veränderung erlaubt', w['Veränderung erlaubt'], false)}
    ${selectField('n_veroeffentlichung', 'Veröffentlichung erlaubt', w['Veröffentlichung erlaubt'], false)}
    ${selectField('n_kooperation', 'Kooperationsinteresse', w['Kooperationsinteresse'], false)}
    ${textField('n_verwandte', 'Verwandte Beiträge', false)}

    <div class="form-actions">
      <button class="btn-new" id="submitBtn" type="button">Beitrag speichern</button>
    </div>
    <div class="status-msg" id="formStatus"></div>
  `;
  document.getElementById('submitBtn').addEventListener('click', submitBeitrag);
}

function getChecked(groupId) {
  return Array.from(document.querySelectorAll('#group_' + groupId + ' input:checked')).map(i => i.value);
}

function submitBeitrag() {
  const pflicht = {
    'Titel': document.getElementById('n_titel').value,
    'Kurzbeschreibung': document.getElementById('n_kurz').value,
    'Hauptbereich': document.getElementById('n_hauptbereich').value,
    'Materialformat': document.getElementById('n_materialformat').value,
    'Umsetzungsstand': document.getElementById('n_umsetzungsstand').value,

    'Sichtbarkeit': document.getElementById('n_sichtbarkeit').value,

  const fehlend = Object.keys(pflicht).filter(k => !pflicht[k]);
  if (!zielgruppe.length) fehlend.push('Zielgruppe');
  const status = document.getElementById('formStatus');
  if (fehlend.length) {
    status.textContent = 'Bitte fülle noch aus: ' + fehlend.join(', ');
    status.className = 'status-msg err';
    return;
  }

  const data = Object.assign({}, pflicht, {
    'Zielgruppe': zielgruppe.join(', '),
    'Name': document.getElementById('n_name').value,
    'E-Mail': document.getElementById('n_email').value,
    'Sprachebene': document.getElementById('n_sprachebene').value,
    'Kostenrahmen für Nachnutzung': document.getElementById('n_kostenrahmen_nachnutzung').value,
    'URL': document.getElementById('n_url').value,
    'Teilnahmeform': document.getElementById('n_teilnahmeform').value,
    'Format': getChecked('n_format').join(', '),
    'Dauer': document.getElementById('n_dauer').value,
    'Gruppengröße': document.getElementById('n_gruppengroesse').value,
    'Aufwand': document.getElementById('n_aufwand').value,
    'Benötigte Ressourcen': document.getElementById('n_ressourcen').value,
    'Kostenrahmen': document.getElementById('n_kostenrahmen').value,
    'Referierende erforderlich': document.getElementById('n_referierende').value,
    'Vorbereitungszeit': document.getElementById('n_vorbereitungszeit').value,
    'Durchführungsanleitung': document.getElementById('n_durchfuehrung').value,
    'Materialien vorhanden': document.getElementById('n_materialien').value,
    'Transferbedingungen': document.getElementById('n_transferbedingungen').value,
    'Übertragbarkeit': document.getElementById('n_uebertragbarkeit').value,
    'Voraussetzungen': getChecked('n_voraussetzungen').join(', '),
    'Bewertung aus der Praxis': document.getElementById('n_bewertung').value,
    'Stolpersteine': document.getElementById('n_stolpersteine').value,
    'Verbesserungsideen': document.getElementById('n_verbesserung').value,
    'Evaluation vorhanden': document.getElementById('n_evaluation').value,
    'Wirkung/Nutzen': document.getElementById('n_wirkung').value,
    'Besonders geeignet für': document.getElementById('n_geeignet_fuer').value,
    'Nicht geeignet für': document.getElementById('n_nicht_geeignet_fuer').value,
    'Veränderung erlaubt': document.getElementById('n_veraenderung').value,
    'Veröffentlichung erlaubt': document.getElementById('n_veroeffentlichung').value,
    'Kooperationsinteresse': document.getElementById('n_kooperation').value,
    'Verwandte Beiträge': document.getElementById('n_verwandte').value,
  });

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  status.textContent = 'Speichern läuft …';
  status.className = 'status-msg';

  // Content-Type text/plain, damit der Browser keinen CORS-Preflight
  // (OPTIONS-Anfrage) auslöst, den Apps Script nicht beantwortet.
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  })
    .then(r => r.json())
    .then(result => {
      if (result.status === 'ok') {
        status.textContent = 'Beitrag wurde gespeichert.';
        status.className = 'status-msg ok';
        renderForm();
      } else {
        throw new Error(result.message || 'Unbekannter Fehler');
      }
    })
    .catch(err => {
      status.textContent = 'Das hat nicht geklappt (' + err.message + '). Bitte erneut versuchen.';
      status.className = 'status-msg err';
      btn.disabled = false;
    });
}

Promise.all([
  fetch(APPS_SCRIPT_URL + '?action=wertelisten').then(r => r.json()),
  fetch(APPS_SCRIPT_URL + '?action=einrichtungen').then(r => r.json())
])
  .then(([wertelisten, einrichtungen]) => {
    WERTELISTEN = wertelisten;
    BEKANNTE_EINRICHTUNGEN = einrichtungen;
    renderForm();
  })
  .catch(() => {
    document.getElementById('formArea').innerHTML =
      '<div class="loading">Die Wertelisten konnten nicht geladen werden. Ist die APPS_SCRIPT_URL korrekt hinterlegt?</div>';
  });
</script>
</body>
</html>
