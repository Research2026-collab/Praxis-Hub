<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisHub – Beitrag einstellen</title>
<style>
:root {
  --navy: #1a365d; --navy-light: #2a4a7f; --teal: #2b7a78; --teal-light: #3aafa9;
  --amber: #d69e2e; --red: #c53030; --green: #276749;
  --bg: #f7f8fa; --surface: #ffffff; --text: #1a202c;
  --text-muted: #4a5568; --text-light: #718096; --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; font-size:15px; }
.app { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
.header { text-align:center; margin-bottom:28px; }
.header img.logo { height:70px; margin-bottom:14px; }
.eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--teal); margin-bottom:6px; }
h1 { font-size:24px; font-weight:800; color:var(--navy); margin:0 0 10px; }
.subtitle { font-size:14px; color:var(--text-muted); max-width:560px; margin:0 auto; }
.nav-links { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
.nav-links a { font-size:12px; font-weight:700; color:var(--navy); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 16px; text-decoration:none; }
.nav-links a:hover { border-color:var(--teal); color:var(--teal); }
.panel-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; }
.form-field { margin-bottom:16px; }
.form-field label { font-size:13px; font-weight:600; display:block; margin-bottom:4px; }
.form-field label .required { color:var(--red); }
.form-field .hint { font-size:12px; color:var(--text-light); margin-bottom:4px; }
input[type="text"], input[type="url"], textarea, select {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:6px;
  font-size:14px; font-family:inherit; color:var(--text); background:var(--bg);
}
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(43,122,120,0.1); }
textarea { min-height:70px; resize:vertical; }
.check-group { display:flex; flex-wrap:wrap; gap:6px; }
.check-item { display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px; }
.check-item.selected { border-color:var(--teal); background:#ebf8ff; }
.check-item input { accent-color:var(--teal); }
.form-section-title { font-size:12px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.06em; margin:24px 0 10px; border-top:1px solid var(--border); padding-top:16px; }
.form-section-title:first-of-type { border-top:none; padding-top:0; }
.form-actions { display:flex; gap:10px; margin-top:24px; }
.btn-new { padding:12px 28px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; border:none; background:var(--teal); color:#fff; font-family:inherit; }
.btn-new:hover:not(:disabled) { background:var(--navy-light); }
.btn-new:disabled { opacity:0.6; cursor:default; }
.status-msg { font-size:13px; margin-top:10px; }
.status-msg.ok { color:var(--green); }
.status-msg.err { color:var(--red); }
.loading { text-align:center; color:var(--text-light); padding:40px 0; }
.form-field label.radio-item, .form-field label.check-item { font-weight:400; display:flex; margin-bottom:0; }
.hint-frei { font-size:12px; color:var(--text-light); margin:-8px 0 8px; }
.intro-box { background:#f0f7f7; border:1px solid #cfe5e4; border-radius:8px; padding:12px 14px; font-size:13px; color:var(--text-muted); margin-bottom:8px; }
.step-title { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:800; color:var(--navy); margin:28px 0 12px; padding-top:18px; border-top:1px solid var(--border); }
.step-title.first { border-top:none; padding-top:0; margin-top:12px; }
.step-no { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; font-size:13px; flex-shrink:0; }
.radio-group { display:flex; flex-direction:column; gap:6px; }
.radio-item { display:flex; align-items:flex-start; gap:8px; padding:8px 12px; border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px; background:var(--bg); }
.radio-item input { margin-top:4px; accent-color:var(--teal); }
.radio-item:has(input:checked) { border-color:var(--teal); background:#ebf8ff; }
.check-item:has(input:checked) { border-color:var(--teal); background:#ebf8ff; }
.form-field.fehler input, .form-field.fehler textarea, .form-field.fehler select, .form-field.fehler .check-group, .form-field.fehler .radio-group { border:1px solid var(--red); border-radius:6px; }
.form-field.fehler > label { color:var(--red); }
.warn-hint { font-size:12px; color:#975a16; background:#fffaf0; border:1px solid #f6e05e; border-radius:6px; padding:6px 10px; margin-top:6px; display:none; }
details.optional { margin-top:28px; border:1px solid var(--border); border-radius:8px; background:#fcfcfd; }
details.optional > summary { cursor:pointer; padding:14px 16px; font-weight:700; color:var(--navy); font-size:14px; list-style:none; }
details.optional > summary::-webkit-details-marker { display:none; }
details.optional > summary::before { content:'▸'; display:inline-block; margin-right:8px; transition:transform .15s; }
details.optional[open] > summary::before { transform:rotate(90deg); }
details.optional .optional-body { padding:0 16px 8px; }
details.optional .summary-hint { display:block; font-weight:400; font-size:12px; color:var(--text-light); margin:2px 0 0 18px; }
.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
@media (max-width:560px) { .row-2 { grid-template-columns:1fr; } }
</style>
</head>

<script>
// Nach dem Deployment die exec-URL der Apps-Script-Web-App hier eintragen.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxp9Q1tJAzkP1quxj5tYoyU63D6PFAvp-VD-36oQn5D2jXzVDBlm-sZyY8vWbmbwZgOBQ/exec';

// Feste Reihenfolge der Nutzungsrechte. Fehlt ein Wert im Tabellenblatt Wertelisten,
// wird er hier trotzdem angeboten, damit keine frei formulierten Varianten entstehen.
const NUTZUNGSRECHTE_STANDARD = [
  'Frei nutzbar ohne Rückfrage',
  'Nutzbar mit Namensnennung der einstellenden Person oder Einrichtung',
  'Nutzbar mit Namensnennung, nicht kommerzielle Nutzung',
  'Nur nach Rücksprache nutzbar',
  'Nicht zur Weitergabe freigegeben'
];
const NUTZUNGSRECHTE_ERKLAERUNG = {
  'Frei nutzbar ohne Rückfrage': 'Andere dürfen den Beitrag ohne Nachfrage verwenden und anpassen.',
  'Nutzbar mit Namensnennung der einstellenden Person oder Einrichtung': 'Nutzung erlaubt, die Quelle muss genannt werden.',
  'Nutzbar mit Namensnennung, nicht kommerzielle Nutzung': 'Wie oben, zusätzlich keine Nutzung in kostenpflichtigen oder gewinnorientierten Angeboten (entspricht CC BY-NC).',
  'Nur nach Rücksprache nutzbar': 'Wer den Beitrag nutzen möchte, meldet sich vorher bei Dir.',
  'Nicht zur Weitergabe freigegeben': 'Der Beitrag dient nur zur Information.'
};
const SPEICHER_SCHLUESSEL = 'praxishub_kontakt';

let BEKANNTE_EINRICHTUNGEN = [];
let WERTELISTEN = {};
let BESTEHENDE_TITEL = [];

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normal(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/\s+,/g, ',').trim(); }

function vereinigt(standard, ausListe) {
  const bekannt = new Set(standard.map(normal));
  return standard.concat((ausListe || []).filter(v => !bekannt.has(normal(v))));
}

function feld(inhalt, id, label, required, hint) {
  return `<div class="form-field" id="feld_${id}">
    <label for="${id}">${label} ${required ? '<span class="required">*</span>' : ''}</label>
    ${hint ? `<div class="hint">${hint}</div>` : ''}
    ${inhalt}
  </div>`;
}

function textField(id, label, required, placeholder, area, hint) {
  const tag = area ? `<textarea id="${id}" placeholder="${esc(placeholder || '')}"></textarea>`
                   : `<input type="text" id="${id}" placeholder="${esc(placeholder || '')}">`;
  return feld(tag, id, label, required, hint);
}

function selectField(id, label, values, required, hint) {
  const opts = (values || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  return feld(`<select id="${id}"><option value="">Bitte wählen</option>${opts}</select>`, id, label, required, hint);
}

function radioGroup(id, label, values, required, hint, vorauswahl, erklaerung) {
  const items = (values || []).map(v => `
    <label class="radio-item">
      <input type="radio" name="${id}" value="${esc(v)}" ${v === vorauswahl ? 'checked' : ''}>
      <span>${esc(v)}${erklaerung && erklaerung[v] ? `<br><span class="hint" style="margin:0">${esc(erklaerung[v])}</span>` : ''}</span>
    </label>`).join('');
  return feld(`<div class="radio-group" id="${id}">${items}</div>`, id, label, required, hint);
}

function checkGroup(id, label, values, required, hint) {
  const items = (values || []).map(v => `
    <label class="check-item"><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join('');
  return feld(`<div class="check-group" id="${id}">${items}</div>`, id, label, required, hint || 'Mehrfachauswahl möglich');
}

function wert(id) {
  const el = document.getElementById(id);
  if (!el) return '';
  if (el.classList.contains('radio-group')) {
    const c = el.querySelector('input:checked'); return c ? c.value : '';
  }
  if (el.classList.contains('check-group')) {
    return Array.from(el.querySelectorAll('input:checked')).map(i => i.value).join(', ');
  }
  return el.value.trim();
}

function renderForm() {
  const w = WERTELISTEN;
  const standardTeilnahmeformen = ['Präsenz', 'Online', 'Hybrid'];
  const teilnahmeformen = (w['Teilnahmeform'] && w['Teilnahmeform'].length) ? w['Teilnahmeform'] : standardTeilnahmeformen;
  const formate = (w['Format'] || []).filter(v => !standardTeilnahmeformen.includes(v));
  const sichtbarkeit = (w['Sichtbarkeit'] && w['Sichtbarkeit'].length) ? w['Sichtbarkeit'] : ['Vollständige Anzeige', 'Reduzierte Anzeige'];
  const einrichtungsOptionen = BEKANNTE_EINRICHTUNGEN.map(v => `<option value="${esc(v)}">`).join('');

  document.getElementById('formArea').innerHTML = `
    <h2 style="font-size:20px; font-weight:800; color:var(--navy); margin-bottom:8px;">Neuen Beitrag einstellen</h2>
    <div class="intro-box">Die drei Schritte dauern etwa fünf Minuten. Felder mit <span class="required" style="color:var(--red)">*</span> sind nötig, alles Weitere ist freiwillig und kann unten ergänzt werden.</div>

    <div class="step-title first"><span class="step-no">1</span>Worum geht es?</div>
    ${textField('n_titel', 'Titel', true)}
    <div class="warn-hint" id="titelWarnung"></div>
    ${textField('n_kurz', 'Kurzbeschreibung', true, 'Zwei bis drei Sätze: Was ist es, für wen, wofür?', true)}
    <div class="row-2">
      ${selectField('n_hauptbereich', 'Hauptbereich', w['Hauptbereich'], true)}
      ${selectField('n_materialformat', 'Art des Beitrags', w['Materialformat'], true)}
    </div>
    ${checkGroup('n_zielgruppe', 'Zielgruppe', w['Zielgruppe'], true)}
    ${textField('n_schlagworte', 'Schlagworte', true, 'z. B. Künstliche Intelligenz, Medienkompetenz, Leichte Sprache', false, 'Mit Komma trennen. Gute Schlagworte machen den Beitrag auffindbar.')}
    ${textField('n_url', 'Link zum Material', false, 'https://…')}
    <div class="warn-hint" id="urlWarnung">Der Link sollte mit https:// oder http:// beginnen.</div>

    <div class="step-title"><span class="step-no">2</span>Wie dürfen andere ihn nutzen?</div>
    ${radioGroup('n_nutzungsrechte', 'Nutzungsrechte', vereinigt(NUTZUNGSRECHTE_STANDARD, w['Nutzungsrechte']), true, '', '', NUTZUNGSRECHTE_ERKLAERUNG)}
    ${radioGroup('n_kostenrahmen_nachnutzung', 'Kosten für andere Einrichtungen', w['Kostenrahmen für Nachnutzung'], false)}
    ${selectField('n_umsetzungsstand', 'Umsetzungsstand', w['Umsetzungsstand'], true)}
    ${radioGroup('n_sichtbarkeit', 'Anzeige im Whiteboard', sichtbarkeit, true, 'Bei reduzierter Anzeige sehen andere nur Titel, Kurzbeschreibung und Kontakt.', sichtbarkeit[0])}

    <div class="step-title"><span class="step-no">3</span>Wer stellt ihn ein?</div>
    ${feld(`<input type="text" id="n_einrichtung" list="liste_einrichtungen" autocomplete="off" placeholder="Namen tippen und Vorschlag auswählen"><datalist id="liste_einrichtungen">${einrichtungsOptionen}</datalist>`,
           'n_einrichtung', 'Einstellende Einrichtung', true, 'Erscheint Deine Einrichtung als Vorschlag, wähle bitte diesen aus.')}
    ${selectField('n_bundesland', 'Bundesland', w['Bundesland'], true)}
    <div class="row-2">
      ${textField('n_name', 'Ansprechperson', false)}
      ${textField('n_email', 'E-Mail', false)}
    </div>
    <div class="hint-frei">Einrichtung, Bundesland und Kontakt merkt sich dieser Browser für Deinen nächsten Beitrag.</div>

    <details class="optional">
      <summary>Weitere Angaben für die Nachnutzung (freiwillig)<span class="summary-hint">Durchführung, Aufwand, Erfahrungen. Hilft anderen beim Übertragen, lässt sich auch später ergänzen.</span></summary>
      <div class="optional-body">
        <div class="form-section-title">Durchführung</div>
        <div class="row-2">
          ${selectField('n_teilnahmeform', 'Teilnahmeform', teilnahmeformen, false)}
          ${selectField('n_sprachebene', 'Sprachebene', w['Sprachebene'], false)}
        </div>
        ${checkGroup('n_format', 'Format', formate, false)}
        <div class="row-2">
          ${textField('n_dauer', 'Dauer', false, 'z. B. 90 Minuten')}
          ${textField('n_gruppengroesse', 'Gruppengröße', false, 'z. B. 8 bis 12 Personen')}
          ${selectField('n_aufwand', 'Aufwand', w['Aufwand'], false)}
          ${textField('n_vorbereitungszeit', 'Vorbereitungszeit', false)}
          ${selectField('n_kostenrahmen', 'Kosten der Durchführung', w['Kostenrahmen'], false)}
          ${selectField('n_referierende', 'Referierende erforderlich', w['Referierende erforderlich'], false)}
        </div>
        ${textField('n_ressourcen', 'Benötigte Ressourcen', false, '', true)}
        ${textField('n_durchfuehrung', 'Durchführungsanleitung', false, '', true)}
        ${textField('n_materialien', 'Materialien vorhanden', false, '', true)}

        <div class="form-section-title">Übertragung</div>
        ${textField('n_transferbedingungen', 'Transferbedingungen', false, 'Was muss eine andere Einrichtung wissen oder anpassen?', true)}
        ${selectField('n_uebertragbarkeit', 'Übertragbarkeit', w['Übertragbarkeit'], false)}
        ${checkGroup('n_voraussetzungen', 'Voraussetzungen', w['Voraussetzungen'], false)}

        <div class="form-section-title">Erfahrungen</div>
        ${textField('n_bewertung', 'Bewertung aus der Praxis', false, '', true)}
        ${textField('n_stolpersteine', 'Stolpersteine', false, '', true)}
        ${textField('n_verbesserung', 'Verbesserungsideen', false, '', true)}
        ${textField('n_wirkung', 'Wirkung/Nutzen', false, '', true)}
        <div class="row-2">
          ${selectField('n_evaluation', 'Evaluation vorhanden', w['Evaluation vorhanden'], false)}
          ${selectField('n_kooperation', 'Kooperationsinteresse', w['Kooperationsinteresse'], false)}
          ${textField('n_geeignet_fuer', 'Besonders geeignet für', false)}
          ${textField('n_nicht_geeignet_fuer', 'Nicht geeignet für', false)}
          ${selectField('n_veraenderung', 'Veränderung erlaubt', w['Veränderung erlaubt'], false)}
          ${selectField('n_veroeffentlichung', 'Veröffentlichung erlaubt', w['Veröffentlichung erlaubt'], false)}
        </div>
        ${textField('n_verwandte', 'Verwandte Beiträge', false)}
      </div>
    </details>

    <div class="form-actions">
      <button class="btn-new" id="submitBtn" type="button">Beitrag speichern</button>
    </div>
    <div class="status-msg" id="formStatus"></div>
  `;

  kontaktLaden();
  document.getElementById('submitBtn').addEventListener('click', submitBeitrag);
  document.getElementById('n_titel').addEventListener('input', titelPruefen);
  document.getElementById('n_url').addEventListener('blur', () => {
    const u = wert('n_url');
    document.getElementById('urlWarnung').style.display = (u && !/^https?:\/\//i.test(u)) ? 'block' : 'none';
  });
  document.getElementById('formArea').addEventListener('input', e => {
    const f = e.target.closest('.form-field'); if (f) f.classList.remove('fehler');
  });
  document.getElementById('formArea').addEventListener('change', e => {
    const f = e.target.closest('.form-field'); if (f) f.classList.remove('fehler');
  });
}

function titelPruefen() {
  const t = normal(wert('n_titel'));
  const box = document.getElementById('titelWarnung');
  const treffer = t.length > 5 ? BESTEHENDE_TITEL.find(b => normal(b.Titel) === t) : null;
  if (treffer) {
    box.textContent = 'Ein Beitrag mit diesem Titel steht bereits im Whiteboard' + (treffer.ID ? ' (ID ' + treffer.ID + ')' : '') + '. Bitte prüfe, ob Du ihn doppelt einstellst.';
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
  return treffer;
}

function kontaktLaden() {
  try {
    const k = JSON.parse(localStorage.getItem(SPEICHER_SCHLUESSEL) || '{}');
    ['n_einrichtung', 'n_bundesland', 'n_name', 'n_email'].forEach(id => { if (k[id]) document.getElementById(id).value = k[id]; });
  } catch (e) { /* Speicher nicht verfügbar */ }
}

function kontaktSpeichern() {
  try {
    const k = {};
    ['n_einrichtung', 'n_bundesland', 'n_name', 'n_email'].forEach(id => { k[id] = wert(id); });
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(k));
  } catch (e) { /* Speicher nicht verfügbar */ }
}

function submitBeitrag() {
  const status = document.getElementById('formStatus');
  const pflicht = {
    'Titel': 'n_titel', 'Kurzbeschreibung': 'n_kurz', 'Hauptbereich': 'n_hauptbereich',
    'Art des Beitrags': 'n_materialformat', 'Zielgruppe': 'n_zielgruppe', 'Schlagworte': 'n_schlagworte',
    'Nutzungsrechte': 'n_nutzungsrechte', 'Umsetzungsstand': 'n_umsetzungsstand', 'Anzeige im Whiteboard': 'n_sichtbarkeit',
    'Einstellende Einrichtung': 'n_einrichtung', 'Bundesland': 'n_bundesland'
  };
  document.querySelectorAll('.form-field.fehler').forEach(f => f.classList.remove('fehler'));
  const fehlend = Object.keys(pflicht).filter(k => !wert(pflicht[k]));
  fehlend.forEach(k => document.getElementById('feld_' + pflicht[k]).classList.add('fehler'));

  const email = wert('n_email');
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('feld_n_email').classList.add('fehler');
    fehlend.push('E-Mail (Schreibweise prüfen)');
  }
  if (fehlend.length) {
    status.textContent = 'Bitte ergänze noch: ' + fehlend.join(', ');
    status.className = 'status-msg err';
    document.querySelector('.form-field.fehler').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (titelPruefen() && !confirm('Ein Beitrag mit diesem Titel existiert bereits. Trotzdem speichern?')) return;

  let url = wert('n_url');
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

  const data = {
    'Titel': wert('n_titel'),
    'Kurzbeschreibung': wert('n_kurz'),
    'Hauptbereich': wert('n_hauptbereich'),
    'Zielgruppe': wert('n_zielgruppe'),
    'Materialformat': wert('n_materialformat'),
    'Umsetzungsstand': wert('n_umsetzungsstand'),
    'Einstellende Einrichtung': wert('n_einrichtung'),
    'Bundesland': wert('n_bundesland'),
    'Nutzungsrechte': wert('n_nutzungsrechte'),
    'Kostenrahmen für Nachnutzung': wert('n_kostenrahmen_nachnutzung'),
    'Schlagworte': wert('n_schlagworte').split(',').map(s => s.trim()).filter(Boolean).join(', '),
    'Sichtbarkeit': wert('n_sichtbarkeit'),
    'Name': wert('n_name'),
    'E-Mail': email,
    'URL': url,
    'Sprachebene': wert('n_sprachebene'),
    'Teilnahmeform': wert('n_teilnahmeform'),
    'Format': wert('n_format'),
    'Dauer': wert('n_dauer'),
    'Gruppengröße': wert('n_gruppengroesse'),
    'Aufwand': wert('n_aufwand'),
    'Benötigte Ressourcen': wert('n_ressourcen'),
    'Kostenrahmen': wert('n_kostenrahmen'),
    'Referierende erforderlich': wert('n_referierende'),
    'Vorbereitungszeit': wert('n_vorbereitungszeit'),
    'Durchführungsanleitung': wert('n_durchfuehrung'),
    'Materialien vorhanden': wert('n_materialien'),
    'Transferbedingungen': wert('n_transferbedingungen'),
    'Übertragbarkeit': wert('n_uebertragbarkeit'),
    'Voraussetzungen': wert('n_voraussetzungen'),
    'Bewertung aus der Praxis': wert('n_bewertung'),
    'Stolpersteine': wert('n_stolpersteine'),
    'Verbesserungsideen': wert('n_verbesserung'),
    'Evaluation vorhanden': wert('n_evaluation'),
    'Wirkung/Nutzen': wert('n_wirkung'),
    'Besonders geeignet für': wert('n_geeignet_fuer'),
    'Nicht geeignet für': wert('n_nicht_geeignet_fuer'),
    'Veränderung erlaubt': wert('n_veraenderung'),
    'Veröffentlichung erlaubt': wert('n_veroeffentlichung'),
    'Kooperationsinteresse': wert('n_kooperation'),
    'Verwandte Beiträge': wert('n_verwandte')
  };

  kontaktSpeichern();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  status.textContent = 'Dein Beitrag wird gespeichert …';
  status.className = 'status-msg';

  // Übermittlung ohne fetch/CORS: klassisches HTML-POST in ein unsichtbares Iframe.
  // Das Apps Script meldet das Ergebnis anschließend per postMessage zurück.
  const iframeName = 'praxishub_post_' + Date.now();
  const iframe = document.createElement('iframe');
  iframe.name = iframeName;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = APPS_SCRIPT_URL;
  form.target = iframeName;
  form.style.display = 'none';
  const payload = document.createElement('input');
  payload.type = 'hidden';
  payload.name = 'payload';
  payload.value = JSON.stringify(data);
  form.appendChild(payload);
  document.body.appendChild(form);

  // Die Bestätigung per postMessage erreicht die Seite nicht in jedem Browser zuverlässig,
  // weil Apps Script seine Antwort in weitere Iframes verpackt. Deshalb prüft die Seite
  // zusätzlich selbst, ob der Beitrag in der Beitragsliste angekommen ist.
  let erledigt = false;
  const gesuchterTitel = normal(data['Titel']);
  const bekannteTreffer = BESTEHENDE_TITEL.filter(b => normal(b.Titel) === gesuchterTitel).length;

  function abschliessen(ok, meldung) {
    if (erledigt) return;
    erledigt = true;
    clearTimeout(sicherheitsnetz);
    window.removeEventListener('message', onPraxisHubPostMessage);
    form.remove(); iframe.remove();
    if (ok) {
      BESTEHENDE_TITEL.push({ Titel: data['Titel'] });
      status.textContent = 'Danke! Dein Beitrag ist gespeichert und im Whiteboard zu finden.';
      status.className = 'status-msg ok';
      setTimeout(() => { renderForm(); window.scrollTo({ top: 0, behavior: 'smooth' }); }, 2500);
    } else {
      status.innerHTML = meldung;
      status.className = 'status-msg err';
      btn.disabled = false;
    }
  }

  function inListePruefen(versuch) {
    if (erledigt) return;
    loadJsonp('list').then(liste => {
      const treffer = (Array.isArray(liste) ? liste : []).filter(b => normal(b.Titel) === gesuchterTitel).length;
      if (treffer > bekannteTreffer) abschliessen(true);
      else if (versuch < 4) setTimeout(() => inListePruefen(versuch + 1), 2500);
    }).catch(() => { if (versuch < 4) setTimeout(() => inListePruefen(versuch + 1), 2500); });
  }

  // Sobald die Antwort des Servers im unsichtbaren Iframe geladen ist, wird nachgesehen.
  iframe.addEventListener('load', () => setTimeout(() => inListePruefen(1), 800));

  const sicherheitsnetz = setTimeout(() => abschliessen(false,
    'Der Beitrag ließ sich noch nicht im Whiteboard finden. Bitte sieh dort in ein bis zwei Minuten nach, bevor Du ihn erneut abschickst, damit er nicht doppelt erscheint. <a href="praxishub-whiteboard.html" target="_blank">Whiteboard öffnen</a>'
  ), 30000);

  function onPraxisHubPostMessage(event) {
    if (!event.data || event.data.source !== 'praxishub') return;
    if (event.data.status === 'ok') abschliessen(true);
    else abschliessen(false, 'Das hat nicht geklappt (' + esc(event.data.message || 'Unbekannter Fehler') + '). Bitte versuche es erneut.');
  }

  window.addEventListener('message', onPraxisHubPostMessage);
  form.submit();
}

// GET-Daten werden per JSONP geladen. Damit entfällt der Safari-fetch-Aufruf,
// der beim Apps-Script-Redirect auf script.googleusercontent.com mit 404 scheitert.
function loadJsonp(action) {
  return new Promise((resolve, reject) => {
    const callbackName = '__praxishub_' + action + '_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(() => cleanup(new Error(action + ': Zeitüberschreitung beim Laden')), 15000);

    function cleanup(err, data) {
      clearTimeout(timer);
      delete window[callbackName];
      script.remove();
      err ? reject(err) : resolve(data);
    }

    window[callbackName] = data => cleanup(null, data);
    script.onerror = () => cleanup(new Error(action + ': API-Antwort konnte nicht geladen werden'));
    script.src = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&callback=' + encodeURIComponent(callbackName);
    document.head.appendChild(script);
  });
}

Promise.all([
  loadJsonp('wertelisten'),
  loadJsonp('einrichtungen')
])
  .then(([wertelisten, einrichtungen]) => {
    WERTELISTEN = wertelisten || {};
    BEKANNTE_EINRICHTUNGEN = einrichtungen || [];
    renderForm();
    // Bestehende Titel im Hintergrund laden, um Doppelungen anzuzeigen. Scheitert das, bleibt das Formular nutzbar.
    loadJsonp('list').then(l => { BESTEHENDE_TITEL = Array.isArray(l) ? l : []; titelPruefen(); }).catch(() => {});
  })
  .catch(err => {
    console.error('[PraxisHub] Formular konnte nicht initialisiert werden:', err);
    document.getElementById('formArea').innerHTML =
      '<div class="loading">Die Wertelisten konnten nicht geladen werden.<br><strong>Technischer Fehler:</strong> ' +
      String(err.message || err).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
  });
</script>
